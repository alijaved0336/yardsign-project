<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Maps</title>
    <style>
        /* General body styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
        }

        /* Header styling */
        header {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 1rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        /* Map container styling */
        #map-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 6rem); /* Adjust for header and footer */
        }

        #map {
            flex: 1;
            height: 100%;
        }

        /* Footer styling */
        footer {
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }

        footer a {
            color: #1abc9c;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- Include OpenLayers -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
    
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Admin Maps Dashboard</h1>
    </header>

    <!-- Map Container -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2024 Admin Maps | Powered by <a href="https://openlayers.org/" target="_blank">OpenLayers</a>
    </footer>

    <!-- JavaScript for Map -->
    <script>
        // Initialize the map
        var map = new ol.Map({
            target: 'map', // ID of the div where the map will be rendered
            layers: [
                // Add a base layer with OpenStreetMap
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([-98.5795, 39.8283]), // Center coordinates for USA
                zoom: 4 // Zoom level for a broader view of the USA
            })
        });
    </script>
</body>
</html>
